<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Handwriting Animator</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef1f6;--bar:#fff;--tx:#1c2433;--mut:#64708a;--bd:#d5dbe8;--acc:#1d4ed8;--accx:#fff;--paper:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10141c;--bar:#1a202c;--tx:#e6eaf3;--mut:#93a0ba;--bd:#2c3547;--acc:#6d93ff;--accx:#0b1020;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.3 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;height:100%}
#bar{background:var(--bar);border-bottom:1px solid var(--bd);padding:10px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.sm{display:flex;gap:6px;align-items:center;color:var(--mut);font-size:13px}.sm input{width:90px}
button,input{font:inherit;color:var(--tx)}
button{background:var(--bar);border:1px solid var(--bd);border-radius:9px;padding:8px 13px;cursor:pointer}
button:hover{border-color:var(--acc)}
button:disabled{opacity:.4;cursor:default}
button.on{background:var(--acc);color:var(--accx);border-color:var(--acc)}
button.pri{background:var(--acc);color:var(--accx);border-color:var(--acc);font-weight:600}
#lab{width:96px;text-align:center;font-size:22px;padding:4px 8px;border:1px solid var(--bd);border-radius:9px;background:var(--bg)}
.seg{display:flex}.seg button{border-radius:0;margin-left:-1px}.seg button:first-child{border-radius:9px 0 0 9px;margin:0}.seg button:last-child{border-radius:0 9px 9px 0}
#msg{color:var(--mut);font-size:13px;min-height:1em;padding:6px 14px 0}
#stage{flex:1;min-height:0;padding:10px 14px 14px;display:flex}
#paper{width:100%;height:100%;border-radius:10px;touch-action:none;cursor:crosshair;background:var(--paper);box-shadow:0 2px 14px rgba(0,0,0,.18)}
body[data-mode=play] #paper{cursor:default}
body[data-mode=draw] .only-play,body[data-mode=play] .only-draw{display:none}
body.hideui #bar,body.hideui #msg{display:none}
body.hideui #stage{padding:0}body.hideui #paper{border-radius:0;box-shadow:none}
body.hideui{background:var(--paper)}
#show{display:none;position:fixed;right:10px;bottom:10px;opacity:0;font-size:12px;padding:6px 10px}
body.hideui #show{display:block}#show:hover{opacity:1}
.orig{fill:none;stroke:#f28a3c;stroke-width:9;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.orig.ghosted{stroke:#e0707a;stroke-width:3;stroke-dasharray:2 7;opacity:.9}
.cp{fill:none;stroke:#1d3a8a;stroke-width:12;stroke-linecap:round;stroke-linejoin:round}
.gd{fill:none;stroke:#8d9bbd;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:.1 17}
.ink{fill:none;stroke:#1d3a8a;stroke-width:14;stroke-linecap:round;stroke-linejoin:round}
.bn{fill:#fff;stroke:#e0707a;stroke-width:2.5}.bt{font:700 17px system-ui,sans-serif;fill:#c0394a;text-anchor:middle;dominant-baseline:central}
.sd{fill:#e0707a}.ar{fill:none;stroke:#8d9bbd;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body data-mode="draw">
<div id="bar">
  <div class="grp"><input id="lab" value="A" maxlength="12" aria-label="Character or word" spellcheck="false" autocomplete="off">
    <div class="seg" id="kinds"><button data-k="upper" class="on">ABC</button><button data-k="lower">abc</button><button data-k="num">123</button><button data-k="word">Word</button></div>
    <div class="seg only-draw" id="pages"><button data-p="slant" class="on">Slanted</button><button data-p="grid">Squared</button></div></div>
  <div class="grp only-draw"><button id="undo">Undo</button><button id="redo">Redo</button><button id="clear">Clear</button></div>
  <div class="sp"></div>
  <div class="grp only-draw"><label class="sm">Smooth <input type="range" id="sm" min="0" max="100" value="75"></label><button id="prev">Preview clean</button><button id="gen" class="pri">Generate Animation</button></div>
  <div class="grp only-play"><button id="replay" class="pri">Replay</button><label class="sm">Speed <input type="range" id="spd" min="25" max="300" value="100"><span id="spv">1×</span></label><button id="edit">Edit drawing</button><button id="hide">Hide controls</button><button id="full">Full screen</button></div>
</div>
<div id="msg"></div>
<div id="stage">
<svg id="paper" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <rect id="sheet" x="-2000" y="-2000" width="5000" height="4600" fill="#fff"/>
  <g id="rule"></g>
  <g id="ghost"></g><g id="guides"></g><g id="ink"></g>
  <g id="pen" style="display:none"><g transform="rotate(32)">
    <polygon points="0,0 -9,-32 9,-32" fill="#e9c58f"/><polygon points="0,0 -3.2,-11 3.2,-11" fill="#2b2f3a"/>
    <rect x="-9" y="-132" width="18" height="100" fill="#f5c230"/><rect x="-2" y="-132" width="4" height="100" fill="#e2a90f"/>
    <rect x="-9.5" y="-146" width="19" height="14" fill="#aeb6c4"/><rect x="-9.5" y="-141" width="19" height="3" fill="#8d96a8"/>
    <rect x="-9.5" y="-160" width="19" height="14" rx="5" fill="#f08c9b"/></g></g>
</svg>
</div>
<button id="show">Show controls</button>
<script>
const $=s=>document.querySelector(s),NS='http://www.w3.org/2000/svg';
const svg=$('#paper'),G=$('#ghost'),GU=$('#guides'),INK=$('#ink'),PEN=$('#pen'),body=document.body;
const ASC='bdfhijklt\u0431\u044a\u0439\u0451\u0444',DESC='gjpqy\u0443\u04af\u0446\u0449\u0434\u0440\u0444';
let strokes=[],redo=[],kind='upper',showClean=false,cur=null,raf=0,P=null,page='slant',sm=75,fl=null,lastRaw=null;
const PAL=[[240,138,36],[167,139,219],[63,174,106]].map(c=>'rgb('+c.join(',')+')');
const msg=t=>$('#msg').textContent=t||'';

/* ---------- drawing input ---------- */
function pt(e){const p=new DOMPoint(e.clientX,e.clientY).matrixTransform(svg.getScreenCTM().inverse());return[p.x,p.y]}
svg.addEventListener('pointerdown',e=>{
  if(body.dataset.mode!=='draw'||showClean||(e.button&&e.button!==0))return;
  if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();svg.setPointerCapture(e.pointerId);fl=lastRaw=pt(e);cur=[fl];redo=[];msg();paint();e.preventDefault()});
svg.addEventListener('pointermove',e=>{
  if(!cur)return;const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
  const a=1-.55*sm/100;for(const ev of (evs.length?evs:[e])){const p=pt(ev),l=cur[cur.length-1];lastRaw=p;fl=[fl[0]+(p[0]-fl[0])*a,fl[1]+(p[1]-fl[1])*a];if(Math.hypot(fl[0]-l[0],fl[1]-l[1])>1.5)cur.push(fl)}paint()});
const end=()=>{if(!cur)return;const l=cur[cur.length-1];if(lastRaw&&cur.length>1&&Math.hypot(lastRaw[0]-l[0],lastRaw[1]-l[1])>1.5)cur.push(lastRaw);if(cur.length===1)cur.push([cur[0][0],cur[0][1]]);strokes.push(cur);cur=null;paint();btns()};
svg.addEventListener('pointerup',end);svg.addEventListener('pointercancel',end);

/* ---------- cleanup ---------- */
function resample(p,step){
  const o=[p[0].slice()];let acc=0,prev=p[0];
  for(let i=1;i<p.length;i++){let a=prev,b=p[i],d=Math.hypot(b[0]-a[0],b[1]-a[1]);
    while(acc+d>=step){const t=(step-acc)/d;a=[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];o.push(a);d=Math.hypot(b[0]-a[0],b[1]-a[1]);acc=0}
    acc+=d;prev=p[i]}
  const l=p[p.length-1],q=o[o.length-1];
  if(Math.hypot(l[0]-q[0],l[1]-q[1])>step*.35)o.push(l.slice());else o[o.length-1]=l.slice();
  return o}
/* Taubin smoothing: alternating shrink/inflate passes remove wobble without collapsing curves; ends stay pinned */
function smooth(s,n){
  const step=l=>{const c=s.map(p=>p.slice());
    for(let i=1;i<s.length-1;i++)for(let j=0;j<2;j++)s[i][j]=c[i][j]+l*((c[i-1][j]+c[i+1][j])/2-c[i][j])};
  for(let k=0;k<n;k++){step(.5);step(-.53)}
  return s}
function isStraight(s){
  const a=s[0],b=s[s.length-1],c=Math.hypot(b[0]-a[0],b[1]-a[1]);if(c<25)return false;
  let m=0;for(const p of s)m=Math.max(m,Math.abs((p[0]-a[0])*(b[1]-a[1])-(p[1]-a[1])*(b[0]-a[0]))/c);
  return m<=Math.max(5,.035*c)}
function cleanStroke(st){
  let len=0;for(let i=1;i<st.length;i++)len+=Math.hypot(st[i][0]-st[i-1][0],st[i][1]-st[i-1][1]);
  if(len<12){const c=st.reduce((a,p)=>[a[0]+p[0]/st.length,a[1]+p[1]/st.length],[0,0]);return[[c,[c[0]+.01,c[1]]]]}
  const r=smooth(resample(st,5),10),n=r.length,K=4,ang=new Array(n).fill(0);
  for(let i=K;i<n-K;i++){const a=[r[i][0]-r[i-K][0],r[i][1]-r[i-K][1]],b=[r[i+K][0]-r[i][0],r[i+K][1]-r[i][1]];
    const m=Math.hypot(...a)*Math.hypot(...b);ang[i]=m?Math.acos(Math.max(-1,Math.min(1,(a[0]*b[0]+a[1]*b[1])/m))):0}
  const cuts=[0];
  for(let i=K+1;i<n-K-1;i++){if(ang[i]<1.25)continue;let mx=true;for(let j=i-K;j<=i+K;j++)if(ang[j]>ang[i]||(ang[j]===ang[i]&&j<i))mx=false;
    if(mx&&i-cuts[cuts.length-1]>K+1)cuts.push(i)}
  cuts.push(n-1);
  const segs=[];
  for(let c=0;c<cuts.length-1;c++){
    let s=smooth(r.slice(cuts[c],cuts[c+1]+1).map(p=>p.slice()),8+Math.round(sm*.6));
    if(s.length<2)continue;
    if(isStraight(s)){segs.push([s[0],s[s.length-1]]);continue}
    const sp=sm>85?5:4,d=[s[0]];for(let i=sp;i<s.length-2;i+=sp)d.push(s[i]);d.push(s[s.length-1]);segs.push(d)}
  return segs}
function target(){
  const lab=[...$('#lab').value.trim()],ch=lab[0]||'';
  
  if(page==='slant'){const w=kind==='word'||(kind==='lower'&&lab.length>1),lo=kind==='lower'&&!w,
    a=lo&&ASC.includes(ch),d=w?lab.some(c=>DESC.includes(c)):lo&&DESC.includes(ch);
    return{x0:70,x1:w?850:560,ha:'l',y0:lo&&!a?260:160,y1:d?460:360,al:w&&d?'c':d?'t':'b'}}
  if(kind==='word'||(kind==='lower'&&lab.length>1)){const d=lab.some(c=>DESC.includes(c));return{x0:80,x1:920,y0:150,y1:d?550:450,al:'c'}}
  if(kind==='lower'){const a=ASC.includes(ch),d=DESC.includes(ch);return{x0:230,x1:770,y0:a?150:300,y1:d?550:450,al:d?'t':'b'}}
  return{x0:230,x1:770,y0:150,y1:450,al:'b'}}
function bez(pts,first){
  let d=first?`M${pts[0][0].toFixed(2)} ${pts[0][1].toFixed(2)}`:'';
  for(let i=0;i<pts.length-1;i++){const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2,f=v=>v.toFixed(2);
    d+=`C${f(p1[0]+(p2[0]-p0[0])/6)} ${f(p1[1]+(p2[1]-p0[1])/6)} ${f(p2[0]-(p3[0]-p1[0])/6)} ${f(p2[1]-(p3[1]-p1[1])/6)} ${f(p2[0])} ${f(p2[1])}`}
  return d}
function buildClean(){
  const all=strokes.map(cleanStroke),flat=all.flat(2);
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const p of flat){x0=Math.min(x0,p[0]);x1=Math.max(x1,p[0]);y0=Math.min(y0,p[1]);y1=Math.max(y1,p[1])}
  const w=Math.max(x1-x0,1),h=Math.max(y1-y0,1),T=target(),s=Math.min((T.x1-T.x0)/w,(T.y1-T.y0)/h);
  const ox=T.ha==='l'?T.x0-x0*s:(T.x0+T.x1)/2-(x0+x1)/2*s;
  const oy=T.al==='b'?T.y1-y1*s:T.al==='t'?T.y0-y0*s:(T.y0+T.y1)/2-(y0+y1)/2*s;
  const tr=p=>[p[0]*s+ox,p[1]*s+oy];
  return all.map(segs=>segs.map(sg=>sg.map(tr))).map(segs=>segs.map((sg,i)=>bez(sg,i===0)).join(''))}

/* ---------- edit rendering ---------- */
const E=(n,a,t)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);if(t!=null)e.textContent=t;return e};
function paint(){
  let h='';const list=cur?[...strokes,cur]:strokes;
  list.forEach((s,i)=>{h+=`<polyline class="orig${showClean?' ghosted':''}" points="${s.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}"/>`;
    if(!showClean)h+=`<circle class="bn" cx="${s[0][0]-24}" cy="${s[0][1]-24}" r="13"/><text class="bt" x="${s[0][0]-24}" y="${s[0][1]-24}">${i+1}</text>`});
  if(showClean&&strokes.length)h+=buildClean().map(d=>`<path class="cp" d="${d}"/>`).join('');
  G.innerHTML=h}
function btns(){$('#undo').disabled=!strokes.length||showClean;$('#redo').disabled=!redo.length||showClean;$('#clear').disabled=!strokes.length||showClean}
$('#undo').onclick=()=>{if(strokes.length){redo.push(strokes.pop());paint();btns()}};
$('#redo').onclick=()=>{if(redo.length){strokes.push(redo.pop());paint();btns()}};
$('#clear').onclick=()=>{strokes=[];redo=[];paint();btns();msg()};
$('#prev').onclick=()=>{if(!strokes.length)return msg('Draw at least one stroke first.');showClean=!showClean;
  $('#prev').textContent=showClean?'Back to drawing':'Preview clean';$('#prev').classList.toggle('on',showClean);
  msg(showClean?'Cleaned version (solid) over your original (dotted red). Your drawing is unchanged.':'');paint();btns()};
document.querySelectorAll('#kinds button').forEach(b=>b.onclick=()=>setKind(b.dataset.k));
function setKind(k){kind=k;document.querySelectorAll('#kinds button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));if(body.dataset.mode==='draw')paint()}
$('#lab').addEventListener('input',()=>{const l=[...$('#lab').value.trim()],c=l[0]||'';
  if(l.length>1)setKind('word');else if(/\d/.test(c))setKind('num');
  else if(c&&c!==c.toLowerCase())setKind('upper');else if(c&&c!==c.toUpperCase())setKind('lower');
  if(body.dataset.mode==='draw')paint()});

/* ---------- page style & smoothing ---------- */
function slantSVG(){const s=.4;let d='',h='',z='';
  for(let n=-8;n<=10;n++){const x=330+560*n;d+=`M${(x-840*s).toFixed(1)} 1200L${(x+1560*s).toFixed(1)} -1200`}
  for(let k=-5;k<=6;k++){const t=-40+300*k;h+=`M-2000 ${t}H3000M-2000 ${t+100}H3000`;z+=`M-2000 ${t+200}H3000`}
  return `<path d="${d}" fill="none" stroke="#a3a8d8" stroke-width="1.8"/><path d="${h}" fill="none" stroke="#6a70b5" stroke-width="2"/><path d="${z}" fill="none" stroke="#8c91c8" stroke-width="1.8" stroke-dasharray="10 9"/><line x1="870" x2="870" y1="-2000" y2="2600" stroke="#d32f2f" stroke-width="3.2"/>`}
function drawRule(){const pc='#fff';$('#sheet').setAttribute('fill',pc);document.documentElement.style.setProperty('--paper',pc);
  $('#rule').innerHTML=page==='slant'?slantSVG():page==='grid'
  ?'<defs><pattern id="gp" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#9cc3ea" stroke-width="1.6"/></pattern></defs><rect x="-2000" y="-2000" width="5000" height="4600" fill="url(#gp)"/>'
  :''}
document.querySelectorAll('#pages button').forEach(b=>b.onclick=()=>{page=b.dataset.p;document.querySelectorAll('#pages button').forEach(x=>x.classList.toggle('on',x===b));drawRule();paint()});
$('#sm').oninput=e=>{sm=+e.target.value;if(showClean)paint()};
$('#lab').addEventListener('keydown',e=>{if(e.key==='Enter')e.target.blur()});

/* ---------- animation ---------- */
const ease=u=>.5-.5*Math.cos(Math.PI*Math.min(1,Math.max(0,u)));
function generate(){
  if(!strokes.length)return msg('Draw at least one stroke first.');
  showClean=false;$('#prev').textContent='Preview clean';$('#prev').classList.remove('on');
  const ds=buildClean();G.innerHTML='';GU.innerHTML='';INK.innerHTML='';msg();
  const items=ds.map((d,i)=>{
    const g=E('path',{d,class:'gd'});GU.appendChild(g);const ink=g;
    const len=ink.getTotalLength(),at=l=>{const p=ink.getPointAtLength(Math.max(0,Math.min(len,l)));return[p.x,p.y]};
    const a=at(0),b=at(Math.min(len,6)),tl=Math.hypot(b[0]-a[0],b[1]-a[1])||1,t=len>1?[(b[0]-a[0])/tl,(b[1]-a[1])/tl]:[1,0];
    const ln=E('path',{d,class:'ink'});ln.style.strokeDasharray=`${len} ${len+4}`;INK.appendChild(ln);
    GU.appendChild(E('circle',{class:'sd',cx:a[0],cy:a[1],r:9}));
    const bx=a[0]-t[0]*38-t[1]*10,by=a[1]-t[1]*38+t[0]*10;
    GU.appendChild(E('circle',{class:'bn',cx:bx,cy:by,r:14}));GU.appendChild(E('text',{class:'bt',x:bx,y:by},i+1));
    if(len>50){const m=at(len*.5),m2=at(len*.5+4),m1=at(len*.5-4),an=Math.atan2(m2[1]-m1[1],m2[0]-m1[0])*180/Math.PI;
      GU.appendChild(E('path',{class:'ar',d:'M-8 -8L4 0L-8 8',transform:`translate(${m[0]} ${m[1]}) rotate(${an})`}))}
    return{ink:ln,col:PAL[i%3],len,at,dur:Math.max(.8,len/230)}});
  let t=0;const ev=[];const first=items[0].at(0);
  ev.push({t0:0,t1:.8,fn:()=>[first[0],first[1],0]});t=.8;
  items.forEach((it,i)=>{
    it.t0=t;it.t1=t+it.dur;ev.push({t0:it.t0,t1:it.t1,fn:u=>{const p=it.at(it.len*ease(u));return[p[0],p[1],0]}});t=it.t1;
    const nx=items[i+1];
    if(nx){const e=it.at(it.len),s=nx.at(0),dist=Math.hypot(s[0]-e[0],s[1]-e[1]),md=.45+dist/1100;
      ev.push({t0:t,t1:t+.2,fn:()=>[e[0],e[1],0]});t+=.2;
      ev.push({t0:t,t1:t+md,fn:u=>{const k=ease(u);return[e[0]+(s[0]-e[0])*k,e[1]+(s[1]-e[1])*k,26*Math.sin(Math.PI*u)]}});t+=md;
      ev.push({t0:t,t1:t+.2,fn:()=>[s[0],s[1],0]});t+=.2}});
  const l=items[items.length-1].at(items[items.length-1].len);
  ev.push({t0:t,t1:t+1.2,fn:()=>[l[0],l[1],0]});t+=1.2;
  P={items,ev,end:t};
  body.dataset.mode='play';PEN.style.display='';play()}
function render(t){
  for(const it of P.items){const u=ease((t-it.t0)/it.dur);it.ink.style.stroke=it.col;it.ink.style.display=u<=0?'none':'';it.ink.style.strokeDashoffset=it.len*(1-u)}
  let e=P.ev[P.ev.length-1],u=1;for(const x of P.ev)if(t<x.t1){e=x;u=(t-x.t0)/(x.t1-x.t0);break}
  const p=e.fn(Math.min(1,Math.max(0,u)));PEN.setAttribute('transform',`translate(${p[0].toFixed(2)} ${(p[1]-p[2]).toFixed(2)})`)}
let speed=1;function play(){cancelAnimationFrame(raf);if(!P)return;let t=0,l=performance.now();
  const f=n=>{t+=Math.min(.1,(n-l)/1000)*speed;l=n;if(t>=P.end){render(P.end);return}render(t);raf=requestAnimationFrame(f)};raf=requestAnimationFrame(f)}
$('#gen').onclick=generate;$('#replay').onclick=play;
$('#spd').oninput=e=>{speed=e.target.value/100;$('#spv').textContent=speed+'×'};
$('#edit').onclick=()=>{cancelAnimationFrame(raf);P=null;GU.innerHTML='';INK.innerHTML='';PEN.style.display='none';
  if(document.fullscreenElement)document.exitFullscreen();body.classList.remove('hideui');body.dataset.mode='draw';paint();btns()};
$('#hide').onclick=()=>body.classList.add('hideui');
$('#show').onclick=()=>body.classList.remove('hideui');
$('#full').onclick=async()=>{body.classList.add('hideui');try{await document.documentElement.requestFullscreen()}catch(e){}};
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)body.classList.remove('hideui')});
svg.addEventListener('click',()=>{if(body.dataset.mode==='play'&&body.classList.contains('hideui'))play()});
addEventListener('keydown',e=>{if(e.target.id==='lab')return;
  const k=e.key.toLowerCase();
  if((e.ctrlKey||e.metaKey)&&!e.altKey&&(k==='z'||k==='y')){e.preventDefault();
    if(body.dataset.mode==='draw'&&!showClean&&!cur)((k==='y'||e.shiftKey)?$('#redo'):$('#undo')).click();return}
  if(e.code==='Space'&&body.dataset.mode==='play'){e.preventDefault();play()}
  if(e.key==='Escape')body.classList.remove('hideui')});
drawRule();paint();btns();msg('Draw each stroke separately, in the order you would write it.');
</script>
