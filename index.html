<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Handwriting Animator</title>
<link rel="stylesheet" href="styles.css">
</head>
<body data-mode="draw">

<!-- ===== Toolbar ===== -->
<div id="bar">
  <!-- Letter & type -->
  <div class="grp">
    <button id="sidebar-toggle" class="icon-btn" title="Toggle layers panel">☰</button>
    <input id="lab" value="A" maxlength="12" aria-label="Character or word" spellcheck="false" autocomplete="off">
    <div class="seg" id="kinds"><button data-k="upper" class="on">ABC</button><button data-k="lower">abc</button><button data-k="num">123</button><button data-k="word">Word</button></div>
  </div>
  <div class="bar-sep"></div>
  <!-- Page style -->
  <div class="grp only-draw">
    <div class="seg" id="pages"><button data-p="slant" class="on">Slanted</button><button data-p="grid">Squared</button></div>
  </div>
  <div class="bar-sep only-draw"></div>
  <!-- Drawing tools -->
  <div class="grp only-draw">
    <div class="seg" id="tools"><button data-t="free" class="on">Freehand</button><button data-t="pen">Pen</button><button data-t="select">Select</button></div>
    <button id="finish" hidden>Finish</button><button id="delpt" hidden>Del point</button><button id="delpath" hidden>Del path</button>
  </div>
  <div class="bar-sep only-draw"></div>
  <!-- Edit operations -->
  <div class="grp only-draw"><button id="undo">Undo</button><button id="redo">Redo</button><button id="clear">Clear</button></div>
  <div class="bar-sep only-draw"></div>
  <!-- Stroke & zoom -->
  <div class="grp"><label class="sm">Width <input type="range" id="sw" min="4" max="30" value="12"><span id="swv">12</span></label></div>
  <div class="grp"><button id="zo" title="Zoom out">−</button><button id="zr" title="Reset zoom">100%</button><button id="zi" title="Zoom in">+</button></div>
  <div class="sp"></div>
  <!-- Draw-mode actions -->
  <div class="grp only-draw">
    <label class="sm">Smooth <input type="range" id="sm" min="0" max="100" value="75"></label>
    <button id="prev">Preview</button>
    <button id="cfgb" title="Settings">⚙</button>
    <button id="gen" class="pri">Generate ▶</button>
  </div>
  <!-- Play-mode actions -->
  <div class="grp only-play">
    <button id="replay" class="pri">Replay ▶</button>
    <label class="sm">Speed <input type="range" id="spd" min="25" max="300" value="100"><span id="spv">1×</span></label>
    <button id="edit">Edit</button>
    <button id="hide">Hide UI</button>
    <button id="full">Fullscreen</button>
  </div>

  <!-- Collapsible settings panel -->
  <div id="panel" hidden>
    <fieldset><legend>Position</legend>
      <label class="sm">Offset <input type="range" id="c-px" min="-250" max="250" value="0"></label>
      <button id="c-ctr">Center</button></fieldset>
    <fieldset><legend>Reference image</legend>
      <button id="r-imp">Import</button><input type="file" id="r-file" accept="image/*" hidden>
      <button id="r-vis" disabled>Hide</button>
      <label class="sm">Opacity <input type="range" id="r-op" min="5" max="100" value="50" disabled></label>
      <label class="sm">Size <input type="range" id="r-sz" min="20" max="300" value="100" disabled></label>
      <button id="r-adj" disabled>Move / resize</button><button id="r-del" disabled>Remove</button></fieldset>
    <fieldset><legend>Guide dots</legend>
      <label class="sm">Size <input type="range" id="dot-size" min="2" max="20" value="7"><span id="dot-size-v">7</span></label>
      <label class="sm">Spacing <input type="range" id="dot-spacing" min="5" max="60" value="17"><span id="dot-spacing-v">17</span></label></fieldset>
    <fieldset><legend>Arrows</legend>
      <label class="sm">Size <input type="range" id="arrow-size" min="0.3" max="3" value="1" step="0.1"><span id="arrow-size-v">1.0</span></label>
      <label class="sm">Spacing <input type="range" id="arrow-spacing" min="40" max="500" value="200"><span id="arrow-spacing-v">200</span></label></fieldset>
    <fieldset><legend>Step numbers</legend>
      <button id="reset-nums">Reset positions</button></fieldset>
  </div>
</div>

<div id="msg"></div>

<!-- ===== Workspace: sidebar + canvas ===== -->
<div id="workspace">
  <!-- Layer sidebar -->
  <div id="sidebar">
    <div class="sidebar-header"><span>Layers</span><button id="add-layer" title="Add new letter">+</button></div>
    <div id="layer-list"></div>
    <div class="sidebar-footer">
      <button id="export-btn" title="Export project as JSON">Export</button>
      <button id="import-btn" title="Import project from JSON">Import</button>
      <input type="file" id="import-file" accept=".json" hidden>
    </div>
  </div>
  <!-- Canvas -->
  <div id="stage">
    <svg id="paper" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
      <rect id="sheet" x="-2000" y="-2000" width="5000" height="4600" fill="#fff"/>
      <g id="rule"></g>
      <g id="ref" style="display:none"><image id="refimg" preserveAspectRatio="none"/></g>
      <g id="inactive"></g>
      <g id="ghost"></g><g id="refui"></g><g id="guides"></g><g id="ink"></g>
      <g id="pen" style="display:none"><g transform="rotate(32)">
        <polygon points="0,0 -9,-32 9,-32" fill="#e9c58f"/><polygon points="0,0 -3.2,-11 3.2,-11" fill="#2b2f3a"/>
        <rect x="-9" y="-132" width="18" height="100" fill="#f5c230"/><rect x="-2" y="-132" width="4" height="100" fill="#e2a90f"/>
        <rect x="-9.5" y="-146" width="19" height="14" fill="#aeb6c4"/><rect x="-9.5" y="-141" width="19" height="3" fill="#8d96a8"/>
        <rect x="-9.5" y="-160" width="19" height="14" rx="5" fill="#f08c9b"/></g></g>
    </svg>
  </div>
</div>

<button id="show">Show controls</button>

<script src="app.js"></script>
<script src="drawing.js"></script>
<script src="animation.js"></script>
</body>
</html>
